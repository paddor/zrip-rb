[package]
name    = "zrip"
version = "0.2.1"
edition = "2021"
build   = "build.rs"

[lib]
name       = "zrip"
crate-type = ["cdylib", "rlib"]

[dependencies]
zstd   = { version = "0.8.11", package = "zrip", features = ["frame", "dict_builder"] }
rb-sys = "0.9.130"

[build-dependencies]
rb-sys = "0.9.130"
